name: Deploy dev - Hetzner

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arenamatch-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: arenamatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arenamatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testar e empacotar
        env:
          ARENA67_TEST_DB_URL: jdbc:postgresql://localhost:5432/arenamatch_test
          ARENA67_TEST_DB_USER: postgres
          ARENA67_TEST_DB_PASSWORD: ci_test_password
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          node --test src/test/js/analytics.test.cjs

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem ARM64 do commit
        run: docker buildx build --platform linux/arm64 --load --tag "arenamatch-dev:$GITHUB_SHA" .

      - name: Publicar no dev por SSH
        env:
          DEV_SSH_HOST: ${{ vars.DEV_SSH_HOST || '178.105.94.89' }}
          DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
          DEV_SSH_USER: ${{ vars.DEV_SSH_USER || 'root' }}
          DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH || '/opt/arenamatch-dev' }}
          DEV_COMPOSE_FILE: ${{ vars.DEV_COMPOSE_FILE || 'docker-compose.yml' }}
          DEV_COMPOSE_PROJECT: ${{ vars.DEV_COMPOSE_PROJECT || 'arenamatch-dev' }}
          DEV_COMPOSE_SERVICE: ${{ vars.DEV_COMPOSE_SERVICE || 'app-dev' }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEV_SSH_USER:?Configure DEV_SSH_USER}"
          : "${DEV_DEPLOY_PATH:?Configure DEV_DEPLOY_PATH}"
          : "${DEV_COMPOSE_FILE:?Configure DEV_COMPOSE_FILE}"
          : "${DEV_COMPOSE_PROJECT:?Configure DEV_COMPOSE_PROJECT}"
          : "${DEV_COMPOSE_SERVICE:?Configure DEV_COMPOSE_SERVICE}"
          : "${DEV_SSH_PRIVATE_KEY:?Configure DEV_SSH_PRIVATE_KEY}"
          : "${DEV_SSH_KNOWN_HOSTS:?Configure DEV_SSH_KNOWN_HOSTS}"
          [[ "$DEV_SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEV_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEV_SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEV_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$DEV_COMPOSE_FILE" =~ ^[a-zA-Z0-9_./-]+$ ]]
          [[ "$DEV_COMPOSE_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$DEV_COMPOSE_SERVICE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]

          ssh_dir="$(mktemp -d)"
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -p "$DEV_SSH_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$DEV_SSH_USER@$DEV_SSH_HOST"

          architecture=$(ssh "${ssh_options[@]}" "$remote" "docker info --format '{{.Architecture}}'")
          if [[ "$architecture" != "aarch64" && "$architecture" != "arm64" ]]; then
            echo "Arquitetura do servidor: $architecture. Esta pipeline publica imagens ARM64." >&2
            exit 1
          fi

          ssh "${ssh_options[@]}" "$remote" \
            "bash -s -- '$DEV_DEPLOY_PATH' '$DEV_COMPOSE_FILE' '$DEV_COMPOSE_PROJECT' '$DEV_COMPOSE_SERVICE' '$GITHUB_SHA' --check" \
            < scripts/deploy-dev.sh

          # A imagem e enviada diretamente, sem registry nem acesso Git no servidor.
          docker image save "arenamatch-dev:$GITHUB_SHA" | gzip -1 |
            ssh "${ssh_options[@]}" "$remote" 'bash -o pipefail -c "gunzip | docker image load"'
          ssh "${ssh_options[@]}" "$remote" \
            "bash -s -- '$DEV_DEPLOY_PATH' '$DEV_COMPOSE_FILE' '$DEV_COMPOSE_PROJECT' '$DEV_COMPOSE_SERVICE' '$GITHUB_SHA'" \
            < scripts/deploy-dev.sh
