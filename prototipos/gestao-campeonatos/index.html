<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Arena Match — Protótipo de Gestão</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="prototype-note"><i class="fa-solid fa-flask"></i> Protótipo navegável — dados fictícios</div>

<div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
        <a href="#" class="brand" data-route="gestao"><span class="brand-mark"><i class="fa-solid fa-futbol"></i></span><span>ARENA <b>MATCH</b></span></a>
        <nav class="desktop-nav"></nav>
        <div class="side-team">
            <span class="crest">MF</span>
            <div><strong>Mocidade FC</strong><small>Mandante</small></div>
        </div>
        <button class="plan-switch" id="planSwitch" type="button" aria-pressed="true">
            <i class="fa-solid fa-crown"></i><span><strong>Plano PRO</strong><small>Toque para simular Básico</small></span>
        </button>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <div class="mobile-team">
                <span class="crest">MF</span>
                <div><strong>Mocidade FC</strong><small>Mandante</small></div>
            </div>
            <div class="top-actions">
                <button class="plan-pill" id="mobilePlanSwitch" type="button" aria-label="Alternar plano na demonstração"><i class="fa-solid fa-crown"></i> <span id="planLabel">PRO ATIVO</span></button>
                <button class="icon-button" type="button" aria-label="Notificações"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
                <button class="logout" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Sair</span></button>
            </div>
        </header>

        <section id="page" class="page" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="agenda-template">
    <div class="page-heading"><div><span class="eyebrow">Módulo principal</span><h1><i class="fa-regular fa-calendar-days"></i> Minha Agenda</h1><p>Seus jogos, convites e resultados continuam concentrados aqui.</p></div></div>
    <div class="hero-card compact"><div><span class="eyebrow">Agosto / Setembro 2026</span><h2>Próximos compromissos</h2></div><button class="secondary-button">Todos os jogos</button></div>
    <div class="event-list">
        <article class="event-card"><span class="event-date"><b>29</b><small>SÁB</small></span><div><strong>Mocidade FC × União da Serra</strong><p>16:00 · Arena Central · Amistoso</p></div><span class="status confirmed">Confirmado</span></article>
        <article class="event-card"><span class="event-date"><b>05</b><small>SÁB</small></span><div><strong>Mocidade FC × Estrela Azul</strong><p>15:30 · Campo do Mocidade · Campeonato</p></div><span class="status pending">Súmula</span></article>
    </div>
</template>

<template id="buscar-template">
    <div class="page-heading"><div><span class="eyebrow">Módulo principal</span><h1><i class="fa-solid fa-location-dot"></i> Buscar jogo</h1><p>Encontre adversários por proximidade sem misturar o fluxo de gestão.</p></div></div>
    <div class="form-card"><label>Data do jogo<input type="date" value="2026-09-12"></label><label>Categoria<select><option>Esporte (Livre)</option><option>Veterano (35+)</option></select></label><label>Distância<input type="range" min="5" max="100" value="25"><span>25 km</span></label><button class="primary-button"><i class="fa-solid fa-magnifying-glass"></i> Buscar adversários</button></div>
</template>

<template id="chat-template">
    <div class="page-heading"><div><span class="eyebrow">Conversas</span><h1><i class="fa-regular fa-comments"></i> Chat</h1><p>Negociações de partidas e avisos importantes.</p></div></div>
    <div class="conversation-list"><button><span class="crest small">US</span><span><strong>União da Serra</strong><small>Combinado! Chegaremos às 15:30.</small></span><time>10:42</time></button><button><span class="crest small purple">EA</span><span><strong>Estrela Azul</strong><small>Nova partida do campeonato.</small></span><time>Ontem</time></button></div>
</template>

<script src="app.js"></script>
</body>
</html>
