<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      lang="pt-BR">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#202b3c"/>
    <title>Arena Match - Recuperar Senha</title>
    <h:outputStylesheet library="css" name="tokens.css"/>
    <h:outputStylesheet library="css" name="styles.css"/>
    <h:outputStylesheet library="css" name="login-publico.css"/>
    <h:outputStylesheet library="css" name="acesso.css"/>
    <link href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</h:head>
<h:body styleClass="am-ui">
    <ui:include src="/WEB-INF/template/cabecalho-acesso.xhtml"/>

    <main class="login-public-main">
        <div class="acesso-card am-card am-card--elevated am-card--accent">
            <h:form id="formRecuperacao" styleClass="acesso-form">
                <p:messages id="messages" showDetail="true" closable="true" styleClass="acesso-mensagens">
                    <p:autoUpdate/>
                </p:messages>

                <h:panelGroup layout="block" styleClass="acesso-form" rendered="#{not recuperarSenhaBean.etapa2}">
                    <div class="acesso-topo">
                        <div class="acesso-icone" aria-hidden="true"><i class="fas fa-unlock-alt"></i></div>
                        <h1 class="acesso-titulo">Esqueceu a senha?</h1>
                        <p class="acesso-descricao">Não se preocupe, acontece nos melhores times. Digite seu e-mail abaixo para receber o código de acesso.</p>
                    </div>

                    <span class="ui-input-icon-left">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <p:inputText id="email" value="#{recuperarSenhaBean.email}" type="email" placeholder="Digite seu e-mail cadastrado"
                                     required="true" requiredMessage="O e-mail é obrigatório."
                                     pt:aria-label="E-mail cadastrado" pt:autocomplete="email" pt:autocapitalize="none"
                                     pt:spellcheck="false"/>
                    </span>

                    <p:commandButton value="ENVIAR CÓDIGO" action="#{recuperarSenhaBean.enviarCodigo}" update="@form"
                                     icon="fas fa-paper-plane" styleClass="acesso-cta"/>

                    <div class="acesso-links">
                        <a href="login.xhtml" class="acesso-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao Login</a>
                    </div>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="acesso-form" rendered="#{recuperarSenhaBean.etapa2}">
                    <div class="acesso-topo">
                        <div class="acesso-icone" aria-hidden="true"><i class="fas fa-envelope-open-text"></i></div>
                        <h1 class="acesso-titulo">Código Enviado!</h1>
                        <p class="acesso-descricao">Verifique seu e-mail e digite o código de 5 dígitos.</p>
                    </div>

                    <p:inputMask id="codigo" value="#{recuperarSenhaBean.codigo}" mask="99999" placeholder="_ _ _ _ _"
                                 required="true" requiredMessage="O código é obrigatório." styleClass="acesso-codigo"
                                 pt:aria-label="Código de 5 dígitos" pt:inputmode="numeric" pt:autocomplete="one-time-code"/>

                    <span class="ui-input-icon-left">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <p:password id="novaSenha" value="#{recuperarSenhaBean.novaSenha}" placeholder="Nova Senha" feedback="true"
                                    promptLabel="Digite uma senha forte" weakLabel="Fraca" goodLabel="Boa" strongLabel="Forte"
                                    required="true" requiredMessage="A nova senha é obrigatória."
                                    pt:aria-label="Nova senha" pt:autocomplete="new-password"/>
                    </span>

                    <span class="ui-input-icon-left">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <p:password id="confirmarSenha" value="#{recuperarSenhaBean.confirmarSenha}" placeholder="Confirmar Nova Senha"
                                    required="true" requiredMessage="A confirmação é obrigatória."
                                    pt:aria-label="Confirmar nova senha" pt:autocomplete="new-password"/>
                    </span>

                    <p:commandButton value="REDEFINIR SENHA" action="#{recuperarSenhaBean.alterarSenha}" update="@form"
                                     icon="fas fa-check" styleClass="acesso-cta"/>

                    <div class="acesso-links">
                        <p:commandLink action="#{recuperarSenhaBean.voltarEtapa1}" update="@form" process="@this" styleClass="acesso-link">
                            <h:outputText value="Alterar e-mail informado"/>
                        </p:commandLink>
                    </div>
                </h:panelGroup>
            </h:form>
        </div>
    </main>
</h:body>
</html>
