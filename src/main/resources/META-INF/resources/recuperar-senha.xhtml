<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      lang="pt-br">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
    <title>Arena Match - Recuperar Senha</title>
    <ui:include src="/WEB-INF/template/recursos-visuais.xhtml"/>
    <link href="#{resource['css:styles.css']}&amp;rev=76.1" rel="stylesheet"/>
    
    <link href="#{resource['css:acesso.css']}&amp;rev=77.1" rel="stylesheet"/>
</h:head>
<h:body styleClass="am-ui am-access am-access-standalone">

    <main class="am-access-main">
        <h:form id="formRecuperacao" styleClass="am-access-form" pt:aria-busy="false">
        <div class="am-access-card">
            <p:defaultCommand target="#{recuperarSenhaBean.etapa2 ? 'redefinir' : 'enviar'}"/>
            <p:messages id="messages" showDetail="true" showSummary="false" closable="true" pt:tabindex="-1">
                <p:autoUpdate/>
            </p:messages>

            <h:panelGroup rendered="#{not recuperarSenhaBean.etapa2}">
                <div class="am-access-intro">
                    <div class="am-access-icon"><i class="fas fa-unlock-alt" aria-hidden="true"></i></div>
                    <h1>Esqueceu a senha?</h1>
                    <p class="am-access-description">Não se preocupe, acontece nos melhores times. Digite seu e-mail abaixo para receber o código de acesso.</p>
                </div>

                <div class="am-access-field">
                    <p:outputLabel for="email" value="E-mail"/>
                    <span class="ui-input-icon-left">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <p:inputText id="email" value="#{recuperarSenhaBean.email}" placeholder="Digite seu e-mail cadastrado"
                                     type="email" autocomplete="email" pt:inputmode="email"
                                     required="true" requiredMessage="O e-mail é obrigatório."/>
                    </span>
                </div>

                <p:commandButton id="enviar" value="ENVIAR CÓDIGO" action="#{recuperarSenhaBean.enviarCodigo}"
                                 update="@form" styleClass="am-access-submit"
                                 onstart="iniciarEnvioAcesso('formRecuperacao')"
                                 oncomplete="concluirEnvioAcesso('formRecuperacao')"
                                 onerror="concluirEnvioAcesso('formRecuperacao')"/>

                <div class="am-access-links">
                    <a href="login.xhtml"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao Login</a>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{recuperarSenhaBean.etapa2}">
                <div class="am-access-intro">
                    <div class="am-access-icon"><i class="fas fa-envelope-open-text" aria-hidden="true"></i></div>
                    <h1>Código Enviado!</h1>
                    <p class="am-access-description">Verifique seu e-mail e digite o código de 5 dígitos.</p>
                </div>

                <div class="am-access-field">
                    <p:outputLabel for="codigo" value="Código de recuperação"/>
                    <p:inputMask id="codigo" value="#{recuperarSenhaBean.codigo}" mask="99999" placeholder="_ _ _ _ _"
                                 pt:inputmode="numeric" pt:autocomplete="one-time-code"
                                 required="true" requiredMessage="O código é obrigatório." styleClass="am-access-code"/>
                </div>

                <div class="am-access-field">
                    <p:outputLabel for="novaSenha" value="Nova senha"/>
                    <span class="ui-input-icon-left">
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <p:password id="novaSenha" value="#{recuperarSenhaBean.novaSenha}" placeholder="Nova Senha" feedback="true"
                                autocomplete="new-password" toggleMask="true"
                                promptLabel="Digite uma senha forte" weakLabel="Fraca" goodLabel="Boa" strongLabel="Forte"
                                required="true" requiredMessage="A nova senha é obrigatória."/>
                    </span>
                </div>

                <div class="am-access-field">
                    <p:outputLabel for="confirmarSenha" value="Confirmar nova senha"/>
                    <span class="ui-input-icon-left">
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <p:password id="confirmarSenha" value="#{recuperarSenhaBean.confirmarSenha}" placeholder="Confirmar Nova Senha"
                                autocomplete="new-password" toggleMask="true"
                                required="true" requiredMessage="A confirmação é obrigatória."/>
                    </span>
                </div>

                <p:commandButton id="redefinir" value="REDEFINIR SENHA" action="#{recuperarSenhaBean.alterarSenha}"
                                 update="@form" styleClass="am-access-submit"
                                 onstart="iniciarEnvioAcesso('formRecuperacao')"
                                 oncomplete="concluirEnvioAcesso('formRecuperacao')"
                                 onerror="concluirEnvioAcesso('formRecuperacao')"/>

                <div class="am-access-links">
                    <p:commandLink value="Alterar e-mail informado" action="#{recuperarSenhaBean.voltarEtapa1}"
                                   update="@form" process="@this" oncomplete="concluirEnvioAcesso('formRecuperacao')"/>
                </div>
            </h:panelGroup>

            <div class="am-access-status" role="status" aria-live="polite">Processando...</div>
        </div>
        </h:form>
    </main>

    <script src="#{resource['js:acesso.js']}&amp;rev=77.1"></script>
</h:body>
</html>
