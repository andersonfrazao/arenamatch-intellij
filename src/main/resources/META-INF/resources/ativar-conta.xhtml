<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      lang="pt-BR">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#202b3c"/>
    <title>Arena Match - Ativar Conta</title>
    <h:outputStylesheet library="css" name="tokens.css"/>
    <h:outputStylesheet library="css" name="styles.css"/>
    <h:outputStylesheet library="css" name="login-publico.css"/>
    <h:outputStylesheet library="css" name="acesso.css"/>
    <link href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</h:head>
<h:body styleClass="am-ui">
    <ui:include src="/WEB-INF/template/cabecalho-acesso.xhtml"/>

    <main class="login-public-main">
        <div class="acesso-card am-card am-card--elevated am-card--accent">
            <h:form id="formAtivacao" styleClass="acesso-form">
                <div class="acesso-topo">
                    <div class="acesso-icone" aria-hidden="true"><i class="fas fa-envelope-open-text"></i></div>
                    <h1 class="acesso-titulo">Ative sua conta</h1>
                    <p class="acesso-descricao">Digite seu e-mail e o codigo de 5 digitos enviado ao finalizar o cadastro.</p>
                </div>

                <p:messages id="messages" showDetail="true" closable="true" styleClass="acesso-mensagens">
                    <p:autoUpdate/>
                </p:messages>

                <span class="ui-input-icon-left">
                    <i class="fas fa-envelope" aria-hidden="true"></i>
                    <p:inputText id="email" value="#{ativacaoContaBean.email}" type="email" placeholder="Digite seu e-mail cadastrado"
                                 required="true" requiredMessage="O e-mail e obrigatorio."
                                 pt:aria-label="E-mail cadastrado" pt:autocomplete="email" pt:autocapitalize="none"
                                 pt:spellcheck="false"/>
                </span>

                <p:inputMask id="codigo" value="#{ativacaoContaBean.codigo}" mask="99999" placeholder="_ _ _ _ _"
                             required="true" requiredMessage="O codigo e obrigatorio." styleClass="acesso-codigo"
                             pt:aria-label="Código de 5 dígitos" pt:inputmode="numeric" pt:autocomplete="one-time-code"/>

                <p:commandButton value="ATIVAR CONTA" action="#{ativacaoContaBean.ativarConta}" update="@form"
                                 icon="fas fa-check" styleClass="acesso-cta"/>

                <div class="acesso-links">
                    <p:commandLink action="#{ativacaoContaBean.reenviarCodigo}" update="@form" process="@form"
                                   styleClass="acesso-link acesso-link--destaque">
                        <h:outputText value="Reenviar codigo de ativacao"/>
                    </p:commandLink>

                    <a href="login.xhtml" class="acesso-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao Login</a>
                </div>
            </h:form>
        </div>
    </main>
</h:body>
</html>
