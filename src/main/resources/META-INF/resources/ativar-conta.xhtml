<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-br">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
    <title>Arena Match - Ativar Conta</title>
    <ui:include src="/WEB-INF/template/recursos-visuais.xhtml"/>
    <link href="#{resource['css:styles.css']}&amp;rev=76.1" rel="stylesheet"/>

    <link href="#{resource['css:acesso.css']}&amp;rev=77.1" rel="stylesheet"/>
</h:head>
<h:body styleClass="am-ui am-access am-access-standalone">

    <main class="am-access-main">
        <h:form id="formAtivacao" styleClass="am-access-form" pt:aria-busy="false">
        <div class="am-access-card">
            <p:defaultCommand target="ativar"/>
            <p:messages id="messages" showDetail="true" showSummary="false" closable="true" pt:tabindex="-1">
                <p:autoUpdate/>
            </p:messages>

            <div class="am-access-intro">
                <div class="am-access-icon"><i class="fas fa-envelope-open-text" aria-hidden="true"></i></div>
                <h1>Ative sua conta</h1>
                <p class="am-access-description">Digite seu e-mail e o codigo de 5 digitos enviado ao finalizar o cadastro.</p>
            </div>

            <div class="am-access-field">
                <p:outputLabel for="email" value="E-mail"/>
                <span class="ui-input-icon-left">
                    <i class="fas fa-envelope" aria-hidden="true"></i>
                    <p:inputText id="email" value="#{ativacaoContaBean.email}" placeholder="Digite seu e-mail cadastrado"
                                 type="email" autocomplete="email" pt:inputmode="email"
                                 required="true" requiredMessage="O e-mail e obrigatorio."/>
                </span>
            </div>

            <div class="am-access-field">
                <p:outputLabel for="codigo" value="Código de ativação"/>
                <p:inputMask id="codigo" value="#{ativacaoContaBean.codigo}" mask="99999" placeholder="_ _ _ _ _"
                             pt:inputmode="numeric" pt:autocomplete="one-time-code"
                             required="true" requiredMessage="O codigo e obrigatorio." styleClass="am-access-code"/>
            </div>

            <p:commandButton id="ativar" value="ATIVAR CONTA" action="#{ativacaoContaBean.ativarConta}"
                             update="@form" styleClass="am-access-submit"
                             onstart="iniciarEnvioAcesso('formAtivacao')"
                             oncomplete="concluirEnvioAcesso('formAtivacao')"
                             onerror="concluirEnvioAcesso('formAtivacao')"/>

            <div class="am-access-links">
                <p:commandLink id="reenviar" value="Reenviar codigo de ativacao"
                               action="#{ativacaoContaBean.reenviarCodigo}" update="@form" process="@this email"
                               resetValues="true"
                               onstart="iniciarEnvioAcesso('formAtivacao')"
                               oncomplete="concluirEnvioAcesso('formAtivacao')"
                               onerror="concluirEnvioAcesso('formAtivacao')"/>

                <a href="login.xhtml"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao Login</a>
            </div>
            <div class="am-access-status" role="status" aria-live="polite">Processando...</div>
        </div>
        </h:form>
    </main>

    <script src="#{resource['js:acesso.js']}&amp;rev=77.1"></script>
</h:body>
</html>
