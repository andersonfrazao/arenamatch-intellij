<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <!-- Cabeçalho público das páginas de acesso (login, ativação e recuperação de senha). ARENA-90 -->
    <header class="login-public-header">
        <div class="login-public-header-inner">
            <a href="#{request.contextPath}/login.xhtml" class="login-public-brand" aria-label="Arena Match, login">
                <img src="#{request.contextPath}/images/logo-arena-match.png" alt="Arena Match" width="348" height="68"/>
            </a>
            <nav id="loginPublicNav" class="login-public-nav" aria-label="Conheça o Arena Match">
                <a href="#{request.contextPath}/encontrar-times-futebol-amador.xhtml">Encontrar adversários</a>
                <a href="#{request.contextPath}/como-funciona.xhtml">Passo a passo</a>
                <a href="#{request.contextPath}/planos.xhtml">Planos</a>
            </nav>
            <div class="login-public-actions">
                <h:link outcome="/index" value="Saiba mais" styleClass="login-public-more"/>
                <button id="loginPublicToggle" class="login-public-toggle" type="button" aria-label="Abrir menu" aria-controls="loginPublicNav" aria-expanded="false">
                    <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </header>
    <script src="#{request.contextPath}/js/login-publico.js?v=90" defer="defer"></script>
</ui:composition>
